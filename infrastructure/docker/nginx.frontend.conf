# Serves the built single-page app and falls back to index.html for
# any path that isn't a real file — required for React Router's
# client-side routes (e.g. /rides/abc-123) to work on a hard refresh.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
